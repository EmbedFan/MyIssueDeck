{# Icons of the application (IS-0007). The address carries a hash of the icon, so a changed icon
   is picked up without clearing the browser cache. #}
<link rel="icon" href="/favicon.ico?v={{ icon_version }}" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/dashboard/static/img/favicon-32.png?v={{ icon_version }}">
<link rel="icon" type="image/png" sizes="48x48" href="/dashboard/static/img/favicon-48.png?v={{ icon_version }}">
<link rel="apple-touch-icon" sizes="180x180" href="/dashboard/static/img/apple-touch-icon.png?v={{ icon_version }}">
<link rel="manifest" href="/dashboard/static/manifest.json?v={{ icon_version }}">
